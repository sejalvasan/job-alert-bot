  # Workday (big companies). host = the part before /<site> in the careers URL.
  # Not yet confirmed: run --check once and delete any that error.
  - { name: NVIDIA,     source: workday, host: nvidia.wd5.myworkdayjobs.com,      tenant: nvidia,     site: NVIDIAExternalCareerSite }
  - { name: Salesforce, source: workday, host: salesforce.wd12.myworkdayjobs.com, tenant: salesforce, site: External_Career_Site }
  - { name: Adobe,      source: workday, host: adobe.wd5.myworkdayjobs.com,       tenant: adobe,      site: external_experienced }

  # Amazon has its own search feed. `queries` are searched; results still go through the filters above.
  - { name: Amazon, source: amazon, queries: ['product manager intern', 'technical program manager intern'] }

  # Jobright's public daily list of PM internships across hundreds of companies
  # (github.com/jobright-ai/2026-Product-Management-Internship). Refreshed once a day (~9 PM ET).
  # Keep this LAST so roles already sent from a company's own feed aren't repeated.
  - { name: Jobright, source: jobright, repo: jobright-ai/2026-Product-Management-Internship, branch: master }

# ─────────────────────────────────────────────────────────────
#  Notifications
# ─────────────────────────────────────────────────────────────
notify:
  # Send a short "bot is alive" message once a day, so silence means "nothing new", not "broken".
  daily_heartbeat: true
  heartbeat_after_hour_et: 9
  # If more than this many new jobs arrive in one run, send them as one digest instead of one message each.
  max_individual_messages: 5
