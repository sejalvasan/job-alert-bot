  # Ashby
  - { name: OpenAI,      source: ashby, board: openai }
  - { name: Notion,      source: ashby, board: notion }
  - { name: Ramp,        source: ashby, board: ramp }
  - { name: Perplexity,  source: ashby, board: perplexity }
