# ─────────────────────────────────────────────────────────────
#  Job Alert Bot — what to watch and what counts as a match
#  Edit this file, commit, and the next run picks it up.
# ─────────────────────────────────────────────────────────────

# A posting is a MATCH when its title:
#   1. matches at least one pattern in `roles`, AND
#   2. matches at least one pattern in `levels`, AND
#   3. matches none of the patterns in `exclude_titles`, AND
#   4. its location matches none of `exclude_locations` (leave empty to allow all).
# Patterns are case-insensitive regular expressions. \b = word boundary,
# so \bintern\b matches "Intern" but NOT "Internal Audit".

filters:
  roles:
    - 'product manag'            # Product Manager, Product Management
    - '\bapm\b'
    - '\bpm\b'                   # "PM Intern", "Associate PM"
    - 'associate product'
    - '\bproduct intern'
    - 'product strategy'
    - 'product operations'
    - 'technical program manag'  # TPM
    - '\bai product'
    - 'forward[- ]deployed'      # FDE roles
    # - 'software engineer'      # uncomment when you start the SWE search

  levels:
    - '\binterns?\b'
    - '\binternships?\b'
    - 'summer 20(26|27)'
    - '\bco-?op\b'
    - '\bmba\b'

  exclude_titles:
    - '\bphd\b'
    - '\bsenior\b'
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\bdirector\b'
    - 'marketing'                # drops "Product Marketing" roles

  # Keep only US (or remote) roles. Set to false to see every country.
  us_only: true

  # Also drop postings whose location OR title mentions any of these
  # (catches e.g. "Internship - France" listed under a New York location).
  exclude_locations:
    - 'france'
    - 'london'
    - 'dublin'
    - 'ireland'
    - 'united kingdom'
    - 'toronto'
    - 'canada'
    - 'zurich'
    - 'poland'
    - 'india'
    - 'bangalore'
    - 'bengaluru'
    - 'singapore'
    - 'tokyo'
    - 'sydney'
    - 'doha'
    - 'germany'
    - 'paris'
    - 'amsterdam'

# ─────────────────────────────────────────────────────────────
#  Companies to watch.
#  Find a company's board name from its careers page URL:
#    boards.greenhouse.io/<name>   or job-boards.greenhouse.io/<name>  → greenhouse
#    jobs.lever.co/<name>                                              → lever
#    jobs.ashbyhq.com/<name>                                           → ashby
#    <tenant>.wd5.myworkdayjobs.com/<site>                             → workday
#  Run `python job_alert.py --check` to confirm every board responds.
# ─────────────────────────────────────────────────────────────

companies:
